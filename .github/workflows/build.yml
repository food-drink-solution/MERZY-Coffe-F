name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/MERZY-Coffe

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        cache-dependency-path: frontend/MERZY-Coffe/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Build application
      run: npm run build -- --configuration production
      env:
        NODE_OPTIONS: "--max-old-space-size=4096"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: frontend/MERZY-Coffe/dist/
        retention-days: 5

  api-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-server

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    - name: Install dependencies
      run: npm install

    - name: Syntax check
      run: npm run check
