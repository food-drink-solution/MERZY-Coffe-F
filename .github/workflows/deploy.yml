name: Deploy to Production

on:
  push:
    branches: [ main ]
    paths: [ 'merzy-coffee/**', 'api-server/**', '.github/workflows/deploy.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  frontend:
    name: Build frontend release artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: merzy-coffee
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: merzy-coffee/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build -- --configuration production
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-dist-${{ github.sha }}
          path: merzy-coffee/dist/merzy/browser/
          retention-days: 30

  backend:
    name: Build & publish API image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish API (zip artifact for runasp.net / IIS upload)
        run: dotnet publish api-server/src/MERZY.Api/MERZY.Api.csproj -c Release -o api-publish --nologo

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish-${{ github.sha }}
          path: api-publish/
          retention-days: 30

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api-server
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ./api-server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
