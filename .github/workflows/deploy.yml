name: Build and Publish Release Artifacts

on:
  push:
    branches: [ main ]
    paths: [ 'merzy-coffee/**', 'api-server/**', '.github/workflows/deploy.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate-and-publish:
    name: Validate and publish release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Validate the frontend before publishing any release artifact.
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: merzy-coffee/package-lock.json

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install frontend dependencies
        working-directory: merzy-coffee
        run: npm ci

      - name: Frontend lint
        working-directory: merzy-coffee
        run: npm run lint

      - name: Frontend unit tests
        working-directory: merzy-coffee
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}

      - name: Frontend production build
        working-directory: merzy-coffee
        run: npm run build -- --configuration production
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      # Validate and publish the backend only after all frontend checks pass.
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore backend
        run: dotnet restore api-server/MERZY.Backend.sln

      - name: Backend Release build
        run: dotnet build api-server/MERZY.Backend.sln -c Release --no-restore

      - name: Backend unit tests
        run: dotnet test api-server/tests/MERZY.UnitTests/MERZY.UnitTests.csproj -c Release --no-build --no-restore --verbosity normal

      - name: Publish API
        run: dotnet publish api-server/src/MERZY.Api/MERZY.Api.csproj -c Release -o api-publish --no-restore --nologo

      # No release artifact or image is published until every required check above passes.
      - name: Upload frontend release artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-dist-${{ github.sha }}
          path: merzy-coffee/dist/merzy/browser/
          retention-days: 30

      - name: Upload API publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish-${{ github.sha }}
          path: api-publish/
          retention-days: 30

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api-server
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api-server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
