name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths: [ 'api-server/**', '.github/workflows/backend.yml' ]
  pull_request:
    branches: [ main, develop ]
    paths: [ 'api-server/**', '.github/workflows/backend.yml' ]

jobs:
  ci:
    name: Lint-level checks & smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-server
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: api-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Smoke test (boot server + health endpoint)
        run: |
          node src/index.js &
          SERVER_PID=$!
          sleep 2
          curl -sf http://localhost:4000/api/health > health.json
          cat health.json
          grep -q '"ok":true' health.json
          kill $SERVER_PID
